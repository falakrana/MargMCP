[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentops-backend"
version = "0.3.0"
description = "AgentOps MCP ingestion and query API"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "prometheus-client>=0.20,<1.0",
    "opentelemetry-api>=1.27,<2.0",
    "opentelemetry-sdk>=1.27,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "httpx>=0.26",
    "requests>=2.31",  # SDK package imports it; needed by the SDK wire-compat test
    "pyyaml>=6.0",  # validates infra/ YAML and Grafana provisioning in tests
]

[tool.setuptools.packages.find]
include = ["agentops_backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
