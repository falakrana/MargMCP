# Prometheus — local development scrape configuration (Phase 4).
# The backend /metrics endpoint requires a bearer token; docker-compose writes
# $AGENTOPS_METRICS_TOKEN to /tmp/agentops_metrics_token at container start so
# no secret lives in this file.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: agentops-backend
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/agentops_metrics_token
    static_configs:
      - targets: ["host.docker.internal:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
