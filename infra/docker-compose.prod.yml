# Production Compose Stack for AgentOps MCP
# Usage:
#   docker compose -f infra/docker-compose.prod.yml --env-file .env up -d
#
# Prerequisite: Configure .env from .env.example with secure, strong secrets.

version: "3.8"

services:
  # Optional local PostgreSQL service (used if not connecting to cloud Postgres like Neon/RDS)
  # postgres:
  #   image: postgres:16-alpine
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_DB: ${POSTGRES_DB:-agentops}
  #     POSTGRES_USER: ${POSTGRES_USER:-agentops}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #   networks:
  #     - agentops_network
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentops} -d ${POSTGRES_DB:-agentops}"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MARG_ENV: production
      MARG_DATABASE_URL: ${MARG_DATABASE_URL:-${AGENTOPS_DATABASE_URL:-postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-marg}}}
      MARG_SECRET_KEY: ${MARG_SECRET_KEY:-${AGENTOPS_SECRET_KEY:?Set MARG_SECRET_KEY in .env}}
      MARG_ADMIN_TOKEN: ${MARG_ADMIN_TOKEN:-${AGENTOPS_ADMIN_TOKEN:?Set MARG_ADMIN_TOKEN in .env}}
      MARG_METRICS_TOKEN: ${MARG_METRICS_TOKEN:-${AGENTOPS_METRICS_TOKEN:?Set MARG_METRICS_TOKEN in .env}}
      MARG_OTLP_ENDPOINT: ${MARG_OTLP_ENDPOINT:-${AGENTOPS_OTLP_ENDPOINT:-http://tempo:4318/v1/traces}}
      MARG_TRACE_SAMPLE_RATIO: ${MARG_TRACE_SAMPLE_RATIO:-${AGENTOPS_TRACE_SAMPLE_RATIO:-1.0}}
      MARG_LOG_LEVEL: ${MARG_LOG_LEVEL:-${AGENTOPS_LOG_LEVEL:-INFO}}
      MARG_LOG_FORMAT: ${MARG_LOG_FORMAT:-${AGENTOPS_LOG_FORMAT:-json}}
      MARG_RUN_RETENTION_DAYS: ${MARG_RUN_RETENTION_DAYS:-${AGENTOPS_RUN_RETENTION_DAYS:-90}}
      MARG_TRACE_RETENTION_DAYS: ${MARG_TRACE_RETENTION_DAYS:-${AGENTOPS_TRACE_RETENTION_DAYS:-30}}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-4}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    networks:
      - marg_network
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${MARG_HTTP_PORT:-${AGENTOPS_HTTP_PORT:-80}}:80"
    networks:
      - marg_network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 15s
      timeout: 3s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        printf '%s' "$$MARG_METRICS_TOKEN" > /tmp/marg_metrics_token &&
        exec /bin/prometheus
        --config.file=/etc/prometheus/prometheus.yml
        --storage.tsdb.path=/prometheus
        --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
    environment:
      MARG_METRICS_TOKEN: ${MARG_METRICS_TOKEN:-${AGENTOPS_METRICS_TOKEN:?Set MARG_METRICS_TOKEN in .env}}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    networks:
      - marg_network
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      backend:
        condition: service_healthy

  tempo:
    image: grafana/tempo:2.6.1
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempodata:/var/tempo
    networks:
      - marg_network
    ports:
      - "3200:3200"   # Tempo HTTP API
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    networks:
      - marg_network
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - tempo

volumes:
  # pgdata:
  promdata:
  tempodata:
  grafanadata:

networks:
  marg_network:
    driver: bridge
