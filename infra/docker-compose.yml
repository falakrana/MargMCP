# Local development stack (Phase 3: backend + PostgreSQL only).
# Prometheus/Tempo/Grafana arrive in later phases.
# Required env (see ../.env.example): POSTGRES_PASSWORD, AGENTOPS_SECRET_KEY, AGENTOPS_ADMIN_TOKEN
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentops}
      POSTGRES_USER: ${POSTGRES_USER:-agentops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentops} -d ${POSTGRES_DB:-agentops}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ../backend
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-agentops}
      POSTGRES_USER: ${POSTGRES_USER:-agentops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      AGENTOPS_ENV: ${AGENTOPS_ENV:-development}
      AGENTOPS_SECRET_KEY: ${AGENTOPS_SECRET_KEY:?set AGENTOPS_SECRET_KEY in .env}
      AGENTOPS_ADMIN_TOKEN: ${AGENTOPS_ADMIN_TOKEN:?set AGENTOPS_ADMIN_TOKEN in .env}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
