name: CI

on:
  push:
    branches: ["main", "master", "**"]
  pull_request:
    branches: ["main", "master"]

jobs:
  backend-tests:
    name: Backend Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ./backend[test] ./sdk pytest pytest-asyncio pytest-cov httpx

      - name: Run Backend Pytest Suite
        env:
          AGENTOPS_SECRET_KEY: ci_secret_key_minimum_32_characters_long_for_test
          AGENTOPS_ADMIN_TOKEN: ci_admin_token_minimum_24_chars_long
          AGENTOPS_METRICS_TOKEN: ci_metrics_token_minimum_24_chars
          AGENTOPS_DATABASE_URL: sqlite:///test_ci.db
          AGENTOPS_ENV: testing
        run: |
          pytest backend/tests -v --durations=10

  sdk-tests:
    name: SDK Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install SDK dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ./sdk[test] pytest pytest-asyncio httpx

      - name: Run SDK Pytest Suite
        run: |
          pytest sdk/tests -v

  frontend-build:
    name: Frontend TypeScript & Vite Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Dashboard SPA
        working-directory: frontend
        run: npm run build

  security-and-secrets:
    name: Secret Leakage & Hygiene Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify no real .env committed
        run: |
          if [ -f .env ] && git ls-files --error-unmatch .env 2>/dev/null; then
            echo "ERROR: Real .env file tracked in git repository!"
            exit 1
          fi
          echo ".env is not tracked in git."

      - name: Verify .env.example contains placeholders only
        run: |
          python -c "
          import re, sys
          bad_patterns = [
              r'gsk_[A-Za-z0-9]{20,}',
              r'sk-[A-Za-z0-9]{20,}',
              r'postgres://[^:]+:[^@]+@',
              r'postgresql://[^:]+:[^@]+@'
          ]
          content = open('.env.example').read()
          for p in bad_patterns:
              if re.search(p, content):
                  print(f'ERROR: Found suspicious credential matching {p} in .env.example')
                  sys.exit(1)
          print('.env.example hygiene verified: only placeholders found.')
          "
